<!-- ═════════════════════════════════════════════════════════════════════════════
     ADVANCED POST MODAL - Ultra High-End Social Media Post Creator
     ═════════════════════════════════════════════════════════════════════════════ -->

<!-- Main Post Modal -->
<div id="advPostModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5000; opacity: 0; transition: opacity 0.3s;">
  <div class="post-modal-content" style="background: var(--card-bg); border-radius: 16px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column;">
    
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 600;">Share ! It</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="advPostPrivacyBadge" style="font-size:12px;padding:4px 10px;background:var(--primary-light);border-radius:20px;color:var(--primary);font-weight:500;">🌍 Public</span>
        <button id="advPostClose" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">✕</button>
      </div>
    </div>

    <!-- Body (scrollable) -->
    <div style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px;">
      
      <!-- User Info -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <img id="advPostCreateAvatar" src="" alt="Your avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
        <div>
          <div id="advPostUserName" style="font-weight: 600; font-size: 14px;">Your Name</div>
          <div id="advPostUserHandle" style="font-size: 12px; color: var(--text-muted);">@yourhandle</div>
        </div>
      </div>

      <!-- Text Editor -->
      <div style="position:relative;">
        <textarea id="advPostText" 
                  placeholder="What's on your mind? Share your thoughts, feelings, and moments..." 
                  style="width: 100%; min-height: 140px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; resize: vertical; background: var(--input-bg); color: var(--text);">
        </textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
          <div style="font-size: 12px; color: var(--text-muted);">
            Tip: Use #hashtags and @mentions for better reach!
          </div>
          <div id="advPostCharCount" style="font-size: 12px; color: var(--text-muted);">0/10000</div>
        </div>
      </div>

      <!-- Upload Progress Container -->
      <div id="advPostUploadProgress" style="display: none; gap: 12px; flex-direction: column;">
        <div id="advPostUploadItems" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Upload progress items will be added here -->
        </div>
      </div>

      <!-- Media Preview Container -->
      <div id="advPostMediaContainer" style="display: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 10px; background: var(--input-bg); border-radius: 8px; border: 1px dashed var(--border);">
      </div>

      <!-- Overall Post Submission Progress (hidden by default) -->
      <div id="advPostSubmitProgress" style="display: none; gap: 12px; flex-direction: column; margin-bottom: 12px;">
        <div style="padding: 12px; background: var(--primary-light); border-radius: 8px; border: 1px solid var(--primary);">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <span style="font-size: 18px;">📤</span>
            <span style="font-weight: 600; color: var(--primary);">Posting...</span>
            <span id="advPostSubmitPercent" style="margin-left: auto; font-weight: 600; color: var(--primary);">0%</span>
          </div>
          <div style="width: 100%; height: 6px; background: rgba(88, 86, 214, 0.2); border-radius: 3px; overflow: hidden;">
            <div id="advPostSubmitBar" style="height: 100%; background: linear-gradient(90deg, var(--primary), #7c6fcf); width: 0%; transition: width 0.3s ease; border-radius: 3px;"></div>
          </div>
        </div>
      </div>

      <!-- Drop Zone for Media -->
      <div id="advPostDropZone" style="border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--input-bg);">
        <div style="font-size: 32px; margin-bottom: 10px;">📸 📹 🎵</div>
        <div style="font-weight: 500; margin-bottom: 5px;">Drag photos, videos, or audio here</div>
        <div style="font-size: 13px; color: var(--text-muted);">or use the buttons below</div>
      </div>

      <!-- Location, Feeling, Activity, Tags, Mentions Display -->
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div id="advPostMetaDisplay" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
          <!-- Will be populated dynamically -->
        </div>
        <div id="advPostTagsDisplay" style="display: flex; flex-wrap: wrap; gap: 8px;">
          <!-- Tags display -->
        </div>
        <div id="advPostMentionsDisplay" style="display: flex; flex-wrap: wrap; gap: 8px;">
          <!-- Mentions display -->
        </div>
      </div>

      <!-- Mention Suggestions -->
      <div id="advPostMentionSuggestions" style="display: none; position: absolute; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 100; min-width: 200px;">
      </div>

    </div>

    <!-- Controls Section -->
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--input-bg); border-radius: 0 0 16px 16px; flex-shrink: 0;">
      
      <!-- Photo -->
      <button type="button" data-media-type="photo" title="Add photo" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        📷
      </button>
      <input type="file" id="advPostPhotoInput" accept="image/*" multiple style="display: none;">

      <!-- Video -->
      <button type="button" data-media-type="video" title="Add video" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        🎬
      </button>
      <input type="file" id="advPostVideoInput" accept="video/*" multiple style="display: none;">

      <!-- Audio -->
      <button type="button" data-media-type="audio" title="Add audio" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        🎵
      </button>
      <input type="file" id="advPostAudioInput" accept="audio/*" multiple style="display: none;">

      <!-- Location -->
      <button id="advPostLocationBtn" type="button" title="Add location" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        📍
      </button>

      <!-- Feeling -->
      <button id="advPostFeelingBtn" type="button" title="How are you feeling?" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        😊
      </button>

      <!-- Activity -->
      <button id="advPostActivityBtn" type="button" title="What are you doing?" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        🎯
      </button>

      <!-- Tags -->
      <button id="advPostTagsBtn" type="button" title="Add tags" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        #️⃣
      </button>

      <!-- Mentions -->
      <button id="advPostMentionsBtn" type="button" title="Mention people" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        👥
      </button>

      <!-- Highlights -->
      <button id="advPostHighlightsBtn" type="button" title="Add highlights" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        ⭐
      </button>

      <!-- Privacy -->
      <button id="advPostPrivacyBtn" type="button" title="Privacy settings" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: auto;">
        🔒
      </button>

    </div>

    <!-- Footer (sticky) -->
    <div style="display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border); flex-shrink: 0;">
      <button id="advPostSubmit" type="button" style="flex: 1; padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s;">
        Share ! It
      </button>
      <button type="button" onclick="AdvancedPost.saveDraft()" style="padding: 12px 24px; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s;">
        💾 Draft
      </button>
    </div>
  </div>
</div>

<!-- Location Picker Modal -->
<div id="advPostLocationModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5001;"></div>

<!-- Feeling/Activity Picker Modal -->
<div id="advPostPickerModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5001;"></div>

<!-- Mentions Modal -->
<div id="advPostMentionsModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5001;"></div>

<!-- Tags Modal -->
<div id="advPostTagsModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5001;"></div>

<!-- Highlights Modal -->
<div id="advPostHighlightsModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5001;"></div>

<!-- Privacy Modal -->
<div id="advPostPrivacyModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 5001;"></div>

<!-- Modal Overlay Content Styles -->
<style>
  .modal-overlay {
    display: none;
  }

  .modal-overlay-content {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-height: 80vh;
    overflow-y: auto;
  }

  .media-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: var(--input-bg);
    border: 1px solid var(--border);
  }

  .media-thumbnail {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .media-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    height: 100px;
    background: var(--input-bg);
    color: var(--text-muted);
  }

  .media-label {
    font-size: 11px;
    text-align: center;
    word-break: break-all;
  }

  .media-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 28px;
    height: 28px;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: 0.2s;
  }

  .media-remove:hover {
    background: rgba(0,0,0,0.8);
  }

  .tag {
    display: inline-block;
    padding: 4px 12px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }

  @keyframes slideInRight {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  @keyframes slideOutRight {
    from {
      transform: translateX(0);
      opacity: 1;
    }
    to {
      transform: translateX(100%);
      opacity: 0;
    }
  }

  @keyframes slideUpFade {
    from {
      transform: translateY(10px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }
</style>
