<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a3de8" />
      <stop offset="40%" stop-color="#1877f2" />
      <stop offset="100%" stop-color="#e4405f" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g filter="url(#glow)">
    <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="700" fill="white">💜</text>
  </g>
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="white">SocialConnect</text>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.9)">Connect • Chat • Share</text>
</svg>
