<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Advanced Attach ✦ Havana</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/advanced-attach.css" />
  <style>
    body {
      margin: 0;
      background: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <script src="/js/advanced-attach.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('userId');
      if (userId) {
        setTimeout(() => AdvancedAttach.open(userId), 100);
      } else {
        document.body.innerHTML = '<div style="color:#888;padding:40px;text-align:center;">No userId specified. Add ?userId=xxx to the URL.</div>';
      }
    });
  </script>
</body>
</html>
