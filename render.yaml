services:
  - type: web
    name: socialconnect
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        value: Admin@2024
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
