services:
  - type: web
    name: socialconnect
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/control/ping
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        value: Admin@2024
      - key: NODE_ENV
        value: production
      - key: POWER_BOT_COUNT
        value: "100"
      - key: POWER_BOT_CACHE_CHUNKS
        value: "2"
      - key: GOOGLE_CLIENT_ID
        value: "965817059764-nqnm69ngsr3i1h3mdqqmi2160d4n1m3u.apps.googleusercontent.com"
      - key: FORCE_DEPLOY
        value: "true"
# ─── Supabase (live database) ─────────────────────────────
      # Replace with your project's values. Find them in Supabase
      # Dashboard → Project Settings → API.
      # The code reads SUPABASE_URL + any of these key names:
      #   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY,
      #   SUPABASE_PUBLISHABLE_KEY, SUPABASE_KEY
      - key: SUPABASE_URL
        value: "https://ppetpuukiffexqoxghnl.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "sb_publishable_zcSzV9eZI9M7R5OpPg7T8A_xs1aNgxA"
      - key: SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_zcSzV9eZI9M7R5OpPg7T8A_xs1aNgxA"
